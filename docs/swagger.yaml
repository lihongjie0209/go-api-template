info:
  contact: {}
  description: 'Production-oriented Go Web API scaffold. Stable application codes:
    0 success; 10001 invalid argument; 10004 not found; 10008 timeout; 10029 throttled;
    20001 unauthorized; 20003 forbidden; 30009 conflict; 30010 processing; 50000 internal;
    50003 dependency unavailable; 50004 authorization unavailable; 50005 authorization
    policy or endpoint metadata missing.'
  title: Go API Template
  version: "1.0"
paths:
  /api/v1/.well-known/jwks.json:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/auth.JWKS'
              type: object
      summary: Publish JWT verification keys in the common API envelope
      tags:
      - authentication
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Client credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/httptransport.LoginResponseBody'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httptransport.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httptransport.Response'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httptransport.Response'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httptransport.Response'
      summary: Issue a JWT access token and record a security event
      tags:
      - authentication
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httptransport.Response'
      security:
      - Bearer: []
      summary: Revoke a user session
      tags:
      - authentication
  /api/v1/auth/password/change:
