# Local development keeps optional infrastructure disabled. Redis remains the
# mandatory coordination dependency and uses the base localhost address.
app:
  env: development
database:
  enabled: false
  name: go_api_template_db
  schema: go_api_template
migration:
  auto_up: false
log:
  level: debug
  format: text
swagger:
  enabled: true
grpc:
  reflection_enabled: true
