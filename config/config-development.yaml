# Local development is intentionally self-contained and keeps optional
# infrastructure disabled until explicitly enabled through APP_* variables.
app:
  env: development
database:
  enabled: false
  name: go_api_template_db
  schema: go_api_template
redis:
  enabled: false
migration:
  auto_up: false
log:
  level: debug
  format: text
swagger:
  enabled: true
grpc:
  reflection_enabled: true
