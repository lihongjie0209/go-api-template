app:
  name: go-api-template
  env: development
  shutdown_timeout: 10s
http:
  address: 127.0.0.1:8080
  read_timeout: 10s
  write_timeout: 15s
  idle_timeout: 60s
  request_timeout: 10s
  max_body_bytes: 16777216
  trusted_proxies: []
  cors:
    enabled: false
    allowed_origins: []
    allowed_headers: [Authorization, Content-Type, X-Request-ID, Idempotency-Key]
    exposed_headers: [X-Request-ID, X-RateLimit-Limit, X-RateLimit-Remaining, Retry-After]
    max_age: 12h
grpc:
  enabled: true
  address: 127.0.0.1:9090
  reflection_enabled: true
  max_receive_bytes: 16777216
  tls:
    enabled: false
    cert_file: ""
    key_file: ""
    client_ca_file: ""
log:
  level: info
  format: json
  file: logs/app.log
  max_size_mb: 100
  max_backups: 10
  max_age_days: 30
  compress: true
database:
  enabled: false
  name: go_api_template_db
  schema: go_api_template
  type: postgres
  dsn: ""
  max_open_conns: 25
  max_idle_conns: 10
  conn_max_lifetime: 5m
  conn_max_idle_time: 1m
  ping_timeout: 5s
distributed_lock:
  ttl: 10s
  retry_delay: 100ms
policy_sync:
  poll_interval: 30s
  timeout: 5s
object_storage:
  enabled: false
  provider: s3 # s3 or oss
  bucket: ""
  region: ""
  endpoint: ""
  access_key_id: "" # inject with APP_OBJECT_STORAGE_ACCESS_KEY_ID
  access_key_secret: "" # inject with APP_OBJECT_STORAGE_ACCESS_KEY_SECRET
  session_token: ""
  use_path_style: false
  use_cname: false
  presign_ttl: 15m
  timeout: 30s
files:
  enabled: false
  max_size_bytes: 10485760
  allowed_types: [] # Empty allows all detected MIME types.
  upload_stale_after: 15m # Pending upload intents older than this are reclaimed.
  deletion_interval: 30s
  deletion_retry_delay: 1m
  deletion_batch_size: 100
operation_log:
  enabled: false
  subject: platform.operation-log.v1
  durable: go-api-template-operation-log
  max_payload_bytes: 8192
security_log:
  enabled: false
  subject: platform.security-log.v1
  durable: go-api-template-security-log
  max_payload_bytes: 4096
  fail_closed: true
  hash_key: "" # Inject APP_SECURITY_LOG_HASH_KEY with at least 32 random bytes.
health:
  database_timeout: 2s
  redis_timeout: 2s
rate_limit:
  enabled: false
  fail_open: false
  ip: {rate: 120, burst: 30, period: 1m}
  api: {rate: 10000, burst: 1000, period: 1m}
  user: {rate: 600, burst: 100, period: 1m}
  login: {rate: 10, burst: 3, period: 1m}
observability:
  metrics_enabled: true
  tracing_enabled: false
  tracing_endpoint: http://127.0.0.1:4318
  tracing_sample_ratio: 0.1
  pprof_enabled: false
  pprof_token: ""
swagger:
  enabled: true
  require_auth: false
jwt:
  issuer: go-api-template
  audience: go-api-template
  algorithm: RS256
  key_id: ""
  # Inject PEM with APP_JWT_PRIVATE_KEY or mount a secret file.
  private_key: ""
  private_key_file: ""
  # Retain old public keys until every token signed by them has expired.
  public_keys: []
  ttl: 2h
auth:
  jwks_url: ""
  issuer: identity-service
  audience: go-api-template
  psk:
    enabled: false
    # Inject with APP_AUTH_PSK_KEY; never commit a real key.
    key: ""
authentication:
  refresh_ttl: 720h
  max_failed_attempts: 5
  lock_duration: 15m
cron:
  enabled: false
  timezone: Asia/Shanghai
  sample_spec: "0 */5 * * * *"
  job_timeout: 30s
migration:
  auto_up: false
  create_schema: false
  path: migrations/postgres
  database_url: ""
  table: go_api_template_schema_migrations

user:
  cache_ttl: 5m

tenant:
  cache_ttl: 5m

platform_config:
  cache_ttl: 5m

dictionary:
  cache_ttl: 5m
  max_tree_nodes: 10000

idempotency:
  enabled: false
  # Only bounded mutation responses belong here. Login/refresh, secret-returning,
  # signed-URL, multipart upload, arbitrary configuration-value and query routes
  # are intentionally excluded.
  http_paths:
    - /api/v1/auth/logout
    - /api/v1/auth/password/reset
    - /api/v1/auth/password/change
    - /api/v1/auth/sessions/revoke
    - /api/v1/auth/sessions/logout-all
    - /api/v1/auth/sessions/force-logout-all
    - /api/v1/files/delete
    - /api/v1/users/create
    - /api/v1/users/update
    - /api/v1/users/delete
    - /api/v1/service-accounts/update
    - /api/v1/service-accounts/delete
    - /api/v1/platform/tenants/create
    - /api/v1/platform/tenants/update
    - /api/v1/platform/tenants/delete
    - /api/v1/tenants/update
    - /api/v1/tenants/delete
    - /api/v1/tenant-members/add
    - /api/v1/tenant-members/status/update
    - /api/v1/tenant-members/remove
    - /api/v1/tenant-departments/create
    - /api/v1/tenant-departments/update
    - /api/v1/tenant-departments/delete
    - /api/v1/tenant-departments/members/set
    - /api/v1/tenant-authorization/permissions/set
    - /api/v1/tenant-authorization/administrators/set
    - /api/v1/tenant-roles/create
    - /api/v1/tenant-roles/update
    - /api/v1/tenant-roles/delete
    - /api/v1/tenant-roles/permissions/set
    - /api/v1/tenant-members/roles/set
    - /api/v1/applications/create
    - /api/v1/applications/update
    - /api/v1/applications/delete
    - /api/v1/navigations/create
    - /api/v1/navigations/update
    - /api/v1/navigations/delete
    - /api/v1/permissions/create
    - /api/v1/permissions/update
    - /api/v1/permissions/delete
    - /api/v1/operation-logs/frontend/record
    - /api/v1/dictionaries/create
    - /api/v1/dictionaries/update
    - /api/v1/dictionaries/delete
    - /api/v1/dictionary-items/create
    - /api/v1/dictionary-items/update
    - /api/v1/dictionary-items/delete
  grpc_methods: []
  processing_ttl: 30s
  result_ttl: 24h
  failure_ttl: 5m
  max_response_bytes: 1048576

event_bus:
  enabled: false
  urls: [nats://127.0.0.1:4222]
  stream_name: PLATFORM_EVENTS
  subjects: [platform.>]
  storage: file
  max_age: 168h
  duplicate_window: 10m
  connect_timeout: 5s
  reconnect_wait: 1s
  publish_timeout: 5s
  consumer_ack_wait: 30s
  consumer_handler_timeout: 25s
  consumer_max_deliver: 10
  dispatch_interval: 1s
  dispatch_batch_size: 100
  dispatch_lease: 30s
  dispatch_retry_delay: 2s

# PostgreSQL/Kingbase native monthly partitions for append-only audit tables.
# Keep disabled unless the database role can create/detach partitions. An empty
# archive_schema permanently drops expired partitions; production should archive.
data_lifecycle:
  enabled: false
  interval: 1h
  timeout: 5m
  premake_months: 6
  purge_batch_size: 1000
  purge_max_batches: 10
  operation_log_retention_months: 12
  security_log_retention_months: 24
  outbox_published_retention: 168h
  outbox_dead_retention: 2160h
  archive_schema: ""

# Named outbound clients. Put environment-specific endpoints and credentials in
# config-{env}.yaml or APP_ variables.
outbound:
  http: {}
  grpc: {}
