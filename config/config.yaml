app:
  name: go-api-template
  env: development
  shutdown_timeout: 10s
http:
  address: 127.0.0.1:8080
  read_timeout: 10s
  write_timeout: 15s
  idle_timeout: 60s
  request_timeout: 10s
  max_body_bytes: 16777216
  trusted_proxies: []
  cors:
    enabled: false
    allowed_origins: []
    allowed_headers: [Authorization, Content-Type, X-Request-ID, Idempotency-Key]
    exposed_headers: [X-Request-ID, X-RateLimit-Limit, X-RateLimit-Remaining, Retry-After]
    max_age: 12h
grpc:
  enabled: true
  address: 127.0.0.1:9090
  reflection_enabled: true
  max_receive_bytes: 16777216
  tls:
    enabled: false
    cert_file: ""
    key_file: ""
    client_ca_file: ""
log:
  level: info
  format: json
  file: logs/app.log
  max_size_mb: 100
  max_backups: 10
  max_age_days: 30
  compress: true
database:
  enabled: false
  name: go_api_template_db
  schema: go_api_template
  type: postgres
  dsn: ""
  max_open_conns: 25
  max_idle_conns: 10
  conn_max_lifetime: 5m
  conn_max_idle_time: 1m
  ping_timeout: 5s
redis:
  enabled: false
  # Empty uses "<app.name>:" to isolate services sharing Redis.
  key_prefix: ""
  address: 127.0.0.1:6379
  username: ""
  password: ""
  db: 0
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s
object_storage:
  enabled: false
  provider: s3 # s3 or oss
  bucket: ""
  region: ""
  endpoint: ""
  access_key_id: "" # inject with APP_OBJECT_STORAGE_ACCESS_KEY_ID
  access_key_secret: "" # inject with APP_OBJECT_STORAGE_ACCESS_KEY_SECRET
  session_token: ""
  use_path_style: false
  use_cname: false
  presign_ttl: 15m
files:
  enabled: false
  max_size_bytes: 10485760
  allowed_types: [] # Empty allows all detected MIME types.
  deletion_interval: 30s
  deletion_retry_delay: 1m
  deletion_batch_size: 100
operation_log:
  enabled: false
  subject: platform.operation-log.v1
  durable: go-api-template-operation-log
  max_payload_bytes: 8192
security_log:
  enabled: false
  subject: platform.security-log.v1
  durable: go-api-template-security-log
  max_payload_bytes: 4096
  fail_closed: true
  hash_key: "" # Inject APP_SECURITY_LOG_HASH_KEY with at least 32 random bytes.
health:
  database_timeout: 2s
  redis_timeout: 2s
rate_limit:
  enabled: false
  fail_open: false
  ip: {rate: 120, burst: 30, period: 1m}
  api: {rate: 10000, burst: 1000, period: 1m}
  user: {rate: 600, burst: 100, period: 1m}
  login: {rate: 10, burst: 3, period: 1m}
observability:
  metrics_enabled: true
  tracing_enabled: false
  tracing_endpoint: http://127.0.0.1:4318
  tracing_sample_ratio: 0.1
  pprof_enabled: false
  pprof_token: ""
swagger:
  enabled: true
  require_auth: false
jwt:
  issuer: go-api-template
  audience: go-api-template
  algorithm: RS256
  key_id: ""
  # Inject PEM with APP_JWT_PRIVATE_KEY or mount a secret file.
  private_key: ""
  private_key_file: ""
  # Retain old public keys until every token signed by them has expired.
  public_keys: []
  ttl: 2h
auth:
  jwks_url: ""
  issuer: identity-service
  audience: go-api-template
  psk:
    enabled: false
    # Inject with APP_AUTH_PSK_KEY; never commit a real key.
    key: ""
authorization:
  enabled: false
  policy_refresh_interval: 30s
authentication:
  refresh_ttl: 720h
  max_failed_attempts: 5
  lock_duration: 15m
cron:
  enabled: true
  timezone: Asia/Shanghai
  sample_spec: "0 */5 * * * *"
migration:
  auto_up: false
  create_schema: false
  path: migrations/postgres
  database_url: ""
  table: go_api_template_schema_migrations

user:
  cache_ttl: 5m
  lock_ttl: 10s
  lock_retry_delay: 100ms

tenant:
  cache_ttl: 5m

menu:
  cache_ttl: 5m
  max_nodes: 10000

platform_config:
  cache_ttl: 5m

idempotency:
  enabled: false
  http_paths: [/api/v1/example/ping, /api/v1/users/create, /api/v1/users/update, /api/v1/users/delete, /api/v1/service-accounts/update, /api/v1/service-accounts/delete, /api/v1/platform/tenants/create, /api/v1/tenants/update, /api/v1/tenants/delete, /api/v1/platform/tenants/update, /api/v1/platform/tenants/delete, /api/v1/permissions/create, /api/v1/permissions/update, /api/v1/permissions/delete]
  grpc_methods: [/hello.v1.HelloService/Ping]
  processing_ttl: 30s
  result_ttl: 24h
  failure_ttl: 5m
  max_response_bytes: 1048576

event_bus:
  enabled: false
  urls: [nats://127.0.0.1:4222]
  stream_name: PLATFORM_EVENTS
  subjects: [platform.>]
  storage: file
  max_age: 168h
  duplicate_window: 10m
  connect_timeout: 5s
  reconnect_wait: 1s
  publish_timeout: 5s
  consumer_ack_wait: 30s
  consumer_max_deliver: 10
  dispatch_interval: 1s
  dispatch_batch_size: 100
  dispatch_lease: 30s
  dispatch_retry_delay: 2s

# PostgreSQL/Kingbase native monthly partitions for append-only audit tables.
# Keep disabled unless the database role can create/detach partitions. An empty
# archive_schema permanently drops expired partitions; production should archive.
data_lifecycle:
  enabled: false
  interval: 1h
  premake_months: 6
  purge_batch_size: 1000
  operation_log_retention_months: 12
  security_log_retention_months: 24
  archive_schema: ""

# Named outbound clients. Put environment-specific endpoints and credentials in
# config-{env}.yaml or APP_ variables.
outbound:
  http: {}
  grpc:
    authorization:
      target: 127.0.0.1:9092
      timeout: 2s
      retry:
        max_attempts: 1
        initial_backoff: 100ms
        max_backoff: 1s
        methods: []
      breaker:
        enabled: true
        failure_threshold: 5
        open_timeout: 30s
      tls:
        enabled: false
        allow_insecure: false
