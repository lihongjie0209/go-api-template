# Production deliberately fails fast until secrets, endpoints, and TLS files
# are injected through APP_* variables or the platform secret manager.
app:
  env: production
http:
  address: 0.0.0.0:8080
log:
  level: info
  format: json
swagger:
  enabled: false
  require_auth: true
grpc:
  address: 0.0.0.0:9090
  reflection_enabled: false
  tls:
    enabled: true
    cert_file: ""
    key_file: ""
database:
  enabled: true
  name: go_api_template_db
  schema: go_api_template
  dsn: ""
redis:
  enabled: true
migration:
  auto_up: true
  create_schema: false
  database_url: ""
rate_limit:
  enabled: true
idempotency:
  enabled: true
  http_paths: [/api/v1/example/ping]
  grpc_methods: [/hello.v1.HelloService/Ping]
observability:
  metrics_enabled: true
  tracing_enabled: false
auth:
  jwks_url: ""
  issuer: identity-service
  audience: go-api-template
authorization:
  enabled: true
outbound:
  grpc:
    authorization:
      target: authorization-service:9090
      timeout: 2s
      retry:
        max_attempts: 1
        initial_backoff: 100ms
        max_backoff: 1s
        methods: []
      breaker:
        enabled: true
        failure_threshold: 5
        open_timeout: 30s
      tls:
        enabled: true
        server_name: authorization-service
        ca_file: ""
