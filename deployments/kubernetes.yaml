apiVersion: v1
kind: Namespace
metadata:
  name: microservices
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: go-api-template
  namespace: microservices
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: go-api-template
  namespace: microservices
data:
  APP_ENV: production
  APP_HTTP_ADDRESS: 0.0.0.0:8080
  APP_GRPC_ADDRESS: 0.0.0.0:9090
  APP_DATABASE_ENABLED: "true"
  APP_DATABASE_TYPE: postgres
  APP_DATABASE_NAME: go_api_template_db
  APP_DATABASE_SCHEMA: go_api_template
  APP_REDIS_ENABLED: "true"
  APP_RATE_LIMIT_ENABLED: "true"
  APP_IDEMPOTENCY_ENABLED: "true"
  APP_OBSERVABILITY_METRICS_ENABLED: "true"
  APP_MIGRATION_AUTO_UP: "true"
  APP_MIGRATION_PATH: /app/migrations/postgres
  APP_MIGRATION_TABLE: go_api_template_schema_migrations
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-api-template
  namespace: microservices
  labels:
    app.kubernetes.io/name: go-api-template
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: go-api-template
  template:
    metadata:
      labels:
        app.kubernetes.io/name: go-api-template
    spec:
      serviceAccountName: go-api-template
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: go-api-template
      containers:
        - name: api
          image: ghcr.io/lihongjie0209/go-api-template:main
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: go-api-template
            - secretRef:
                name: go-api-template
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: grpc
              containerPort: 9090
              protocol: TCP
          startupProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: [sh, -c, sleep 5]
          volumeMounts:
            - name: logs
              mountPath: /app/logs
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
      volumes:
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: go-api-template
  namespace: microservices
  labels:
    app.kubernetes.io/name: go-api-template
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: go-api-template
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 9090
      targetPort: grpc
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: go-api-template
  namespace: microservices
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: go-api-template
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: go-api-template
  namespace: microservices
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: go-api-template
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: go-api-template
  namespace: microservices
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: go-api-template
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - {port: 8080, protocol: TCP}
        - {port: 9090, protocol: TCP}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - ports:
        - {port: 3306, protocol: TCP}
        - {port: 5432, protocol: TCP}
        - {port: 6379, protocol: TCP}
        - {port: 4318, protocol: TCP}
        - {port: 443, protocol: TCP}
