apiVersion: v1
kind: Secret
metadata:
  name: go-api-template
  namespace: microservices
type: Opaque
stringData:
  # Copy this file outside source control, replace every value, then apply it.
  APP_DATABASE_DSN: postgres://user:password@postgres:5432/go_api_template_db?sslmode=require&search_path=go_api_template
  APP_MIGRATION_DATABASE_URL: postgres://user:password@postgres:5432/go_api_template_db?sslmode=require&search_path=go_api_template
  APP_REDIS_ADDRESS: redis:6379
  APP_REDIS_PASSWORD: replace-me
  APP_JWT_KEY_ID: replace-with-a-deployment-key-id
  # Prefer creating this Secret with --from-file=APP_JWT_PRIVATE_KEY=/secure/path/jwt-private.pem.
  APP_JWT_PRIVATE_KEY: replace-with-an-rsa-or-ecdsa-private-key-pem
  APP_AUTH_JWKS_URL: https://identity.example.com/.well-known/jwks.json
  APP_SECURITY_LOG_HASH_KEY: replace-with-at-least-32-random-bytes
---
apiVersion: v1
kind: Secret
metadata:
  name: go-api-template-tls
  namespace: microservices
type: Opaque
stringData:
  # Prefer creating this Secret from reviewed certificate files as shown in README.
  grpc-tls.crt: replace-with-server-certificate-pem
  grpc-tls.key: replace-with-server-private-key-pem
  authorization-ca.crt: replace-with-authorization-service-ca-pem
