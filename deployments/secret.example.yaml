apiVersion: v1
kind: Secret
metadata:
  name: go-api-template
  namespace: microservices
type: Opaque
stringData:
  # Copy this file outside source control, replace every value, then apply it.
  APP_DATABASE_DSN: postgres://user:password@postgres:5432/go_api_template_db?sslmode=require&search_path=go_api_template
  APP_MIGRATION_DATABASE_URL: postgres://user:password@postgres:5432/go_api_template_db?sslmode=require&search_path=go_api_template
  APP_REDIS_ADDRESS: redis:6379
  APP_REDIS_PASSWORD: replace-me
  APP_JWT_SECRET: replace-with-at-least-32-random-bytes
  APP_AUTH_CLIENT_ID: replace-me
  APP_AUTH_CLIENT_SECRET: replace-me
