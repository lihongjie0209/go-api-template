name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/lihongjie0209/go-api-template

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify modules
        run: make modules-check
      - name: Test with race detector
        run: go test -race -shuffle=on -coverprofile=coverage.out ./...
      - name: Build with Git metadata
        run: |
          build_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          make build VERSION="ci-${GITHUB_SHA::12}" COMMIT="$GITHUB_SHA" BUILD_TIME="$build_time"
          ./bin/api -version | grep -F "version=ci-${GITHUB_SHA::12} commit=$GITHUB_SHA build_time=$build_time"
          ./bin/migrate -version | grep -F "version=ci-${GITHUB_SHA::12} commit=$GITHUB_SHA build_time=$build_time"
          ./bin/outboxctl version | grep -F "version=ci-${GITHUB_SHA::12} commit=$GITHUB_SHA build_time=$build_time"
      - name: Vet
        run: go vet ./...
      - name: Scan reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          args: ./...
      - name: Verify generated Swagger
        run: go run github.com/swaggo/swag/cmd/swag@v1.16.6 init -g cmd/api/main.go -o docs --parseInternal && git diff --exit-code -- docs
      - name: Verify integration execution policy
        run: make integration-policy-check
      - name: Validate Docker Compose development stack
        run: make compose-check
      - uses: bufbuild/buf-action@v1
        with:
          version: "1.50.0"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          setup_only: true
      - name: Verify protobuf contracts and generated code
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            buf breaking --against ".git#branch=origin/$BASE_REF" --against-config buf.yaml
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            buf breaking --against '.git#ref=HEAD^' --against-config buf.yaml
          fi
          make proto-check
      # microgen:template-only:start
      - name: Verify generated microservice
        run: |
          go build -o /tmp/microgen ./cmd/microgen
          generated_root="$(mktemp -d)"
          /tmp/microgen new \
            --name ci-service \
            --namespace ci-services \
            --database-name ci_service_db \
            --database-schema ci_service \
            --module github.com/example/ci-service \
            --source . \
            --output "$generated_root/ci-service" \
            --git-init=false
          cd "$generated_root/ci-service"
          go test ./...
          go vet ./...
      # microgen:template-only:end
      - name: Validate Kubernetes manifests
        run: |
          make k8s-render-check
          go run github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0 -strict -summary deployments/*.yaml

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run Testcontainers integration suite
        run: make ci-test-integration

  container:
    if: github.event_name == 'push'
    needs: [verify, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Resolve image registry
        id: registry
        shell: bash
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          first="${IMAGE_NAME%%/*}"
          case "$first" in
            *.*|*:*|localhost) host="$first" ;;
            *) host=docker.io ;;
          esac
          if { [ -n "$REGISTRY_USERNAME" ] && [ -z "$REGISTRY_PASSWORD" ]; } || { [ -z "$REGISTRY_USERNAME" ] && [ -n "$REGISTRY_PASSWORD" ]; }; then
            echo "configure both registry credential secrets together" >&2
            exit 1
          fi
          if [ "$host" != ghcr.io ] && { [ -z "$REGISTRY_USERNAME" ] || [ -z "$REGISTRY_PASSWORD" ]; }; then
            echo "REGISTRY_USERNAME and REGISTRY_PASSWORD secrets are required for $host" >&2
            exit 1
          fi
          echo "host=$host" >> "$GITHUB_OUTPUT"
      - name: Log in to image registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
      - name: Resolve build metadata
        id: build
        shell: bash
        run: |
          echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
      - name: Build and publish image
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.build.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.build.outputs.build_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Report immutable image reference
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          test -n "$IMAGE_DIGEST"
          printf 'Verified image: `%s@%s`\n' "$IMAGE_NAME" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
