name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify modules
        run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - name: Test with race detector
        run: go test -race -shuffle=on -coverprofile=coverage.out ./...
      - name: Build with Git metadata
        run: |
          build_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          make build VERSION="ci-${GITHUB_SHA::12}" COMMIT="$GITHUB_SHA" BUILD_TIME="$build_time"
          ./bin/api -version | grep -F "version=ci-${GITHUB_SHA::12} commit=$GITHUB_SHA build_time=$build_time"
      - name: Vet
        run: go vet ./...
      - name: Verify generated Swagger
        run: go run github.com/swaggo/swag/cmd/swag@v1.16.6 init -g cmd/api/main.go -o docs --parseInternal && git diff --exit-code -- docs
      - uses: arduino/setup-protoc@v3
        with:
          version: "25.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify generated protobuf
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          make proto-check

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run Testcontainers integration suite
        run: go test -tags=integration -count=1 -timeout=15m ./integration/...
