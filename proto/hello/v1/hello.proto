syntax = "proto3";

package hello.v1;

option go_package = "github.com/lihongjie0209/go-api-template/gen/hello/v1;hellov1";

service HelloService {
  rpc Ping(PingRequest) returns (PingResponse);
}

service UserService {
  rpc CreateUser(CreateUserRequest) returns (User);
  rpc GetUser(GetUserRequest) returns (User);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc UpdateUser(UpdateUserRequest) returns (User);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
}

message PingRequest {
  string message = 1;
}

message PingResponse {
  string message = 1;
  string version = 2;
}

message User {
  string id = 1;
  string name = 2;
  string email = 3;
  int64 version = 4;
  string created_at = 5;
  string updated_at = 6;
}

message CreateUserRequest { string name = 1; string email = 2; }
message GetUserRequest { string id = 1; }
message ListUsersRequest { int32 page = 1; int32 page_size = 2; }
message ListUsersResponse { repeated User users = 1; int64 total = 2; int32 page = 3; int32 page_size = 4; }
message UpdateUserRequest { string id = 1; string name = 2; string email = 3; int64 version = 4; }
message DeleteUserRequest { string id = 1; int64 version = 2; }
message DeleteUserResponse { bool deleted = 1; }
